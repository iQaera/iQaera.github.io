<style>
:root {
--bg-color: #0a0a0a;

--text-main: #f5f5f5;
--text-muted: #8a8a8a;
--border-color: #262626;
--accent: #ffffff;
}* {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        padding: 3rem 1rem;
    }

    header {
        max-width: 1200px;
        margin: 0 auto 1rem auto;
        padding: 0 1rem;
        text-align: center;
    }

    h1 {
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: -0.02em;
    }

    .intro-text {
        max-width: 800px;
        margin: 0 auto 3rem auto;
        padding: 0 1rem;
        text-align: center;
        color: var(--text-muted);
    }

    /* Portfolio Presentation Grid */
    main {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2.5rem;
        padding: 0 1rem;
    }

    .portfolio-block {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .media-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
    }

    .media-container img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        top: 0;
        left: 0;
        z-index: 1;
        transition: opacity 0.3s ease;
    }

    .media-container:focus-within img,
    .media-container:hover img {
        opacity: 0;
        pointer-events: none;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .meta-panel {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .meta-title {
        font-size: 1rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
        letter-spacing: -0.01em;
    }

    .meta-desc {
        color: var(--text-muted);
        font-size: 0.82rem;
        line-height: 1.4;
    }

    footer {
        max-width: 1200px;
        margin: 6rem auto 2rem auto;
        padding: 0 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    /* Custom Grid Styles for Licensing Section */
    .licensing-grid {
        display: grid;
        grid-template-columns: 1fr 1.25fr 1.75fr 1fr;
        margin: 1.5rem 0 2.5rem 0;
        font-size: 0.75rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border-color);
        border-left: 1px solid var(--border-color);
        min-width: 800px;
    }

    .licensing-cell {
        border-bottom: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        padding: 1rem;
    }

    .licensing-header {
        background-color: var(--card-bg);
        color: var(--text-main);
        font-weight: 600;
        letter-spacing: 0.02em;
    }

    .licensing-grid ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .licensing-grid ul li {
        margin-bottom: 0.5rem;
    }
    
    .licensing-grid ul li:last-child {
        margin-bottom: 0;
    }

    .pricing-model {
        font-weight: 600;
        color: var(--text-main);
        display: block;
        margin-bottom: 0.25rem;
    }
&lt;/style&gt;
</head>

&lt;div style="max-width: 1200px; margin: 4rem auto 0 auto; padding: 0 1rem; font-size: 0.75rem; color: #555; letter-spacing: 0.02em; border-top: 1px dashed #262626; padding-top: 1.5rem;"&gt;
    
    &lt;strong style="color: var(--text-main); display: block; margin-bottom: 0.5rem; font-size: 0.85rem;"&gt;SYSTEM ARCHITECTURE &amp;amp; TECHNICAL SPECIFICATIONS&lt;/strong&gt;
    &lt;p style="margin-bottom: 1rem; color: var(--text-muted);"&gt;The iQæra processing core replaces destructive compression matrices with a closed, deterministic rendering environment to ensure absolute mathematical coherence with the physical parameters of the installation site.&lt;/p&gt;
    &lt;ul style="list-style: none; padding: 0; margin-bottom: 1.5rem;"&gt;
        &lt;li style="margin-bottom: 0.5rem;"&gt;• &lt;strong style="color: var(--text-main);"&gt;Floating-Point Luma Isolation&lt;/strong&gt; The Chroma-Locked Pipeline executes a linearized 2.2-gamma passthrough to mathematically secure spatial boundaries, bypassing dynamic digital tinting and eliminating spectral drift on high-nit commercial LED walls.&lt;/li&gt;
        &lt;li style="margin-bottom: 0.5rem;"&gt;• &lt;strong style="color: var(--text-main);"&gt;Torus-Mapped Vector Generation&lt;/strong&gt; Environments are generated via fixed-point mathematical kernels simulating fluid dynamics and light transport. Wrapped across multi-dimensional torus pathways, this guarantees continuous structural motion without detectable reset frames.&lt;/li&gt;
        &lt;li style="margin-bottom: 0.5rem;"&gt;• &lt;strong style="color: var(--text-main);"&gt;Transient Acoustic Preservation&lt;/strong&gt; An oversampled, sovereign deterministic audio engine natively restores peak transient data. With 48Hz sub-harmonic tuning, it strips away digital glassiness to prevent listener fatigue and protect multi-zone speakers from physical strain.&lt;/li&gt;
        &lt;li style="margin-bottom: 0.5rem;"&gt;• &lt;strong style="color: var(--text-main);"&gt;Forensic Waveform Security&lt;/strong&gt; Every asset embeds a sub-perceptual cryptographic watermark directly into the physical audio structure, ensuring un-strippable compliance tracking and IP security.&lt;/li&gt;
        &lt;li style="margin-bottom: 0.5rem;"&gt;• &lt;strong style="color: var(--text-main);"&gt;Delivery Formats&lt;/strong&gt; Constant Rate Factor (CRF 18) Master Profiles, MPEG-4 Native Bitstream, 4K, 60fps, and 1:1 native pixel mapping.&lt;/li&gt;
    &lt;/ul&gt;
    
    &lt;strong style="color: var(--text-main);"&gt;Enterprise Site License&lt;/strong&gt; 
    Includes multi-display public performance rights, hardware-specific optimization, and enterprise-grade file delivery for high-density hospitality matrices.&lt;p&gt;&lt;br&gt;&lt;br&gt;

            &lt;!-- Row 1 --&gt;

            &lt;!-- Row 2 --&gt;

    &lt;strong style="color: var(--text-main);"&gt;Bespoke Calibration&lt;/strong&gt; 
    Includes custom visual aspect-ratio re-editing and hardware-specific sound design to calibrate the 48Hz sub-harmonic transitions directly to your property’s physical architecture.&lt;br&gt;&lt;br&gt;
    
    &lt;strong style="color: var(--text-main);"&gt;Bespoke Content&lt;/strong&gt; 
    All installs are rendered and delivered with site-specific sequencing and audio for one-of-a-kind customization.&lt;br&gt;&lt;br&gt;
    
    &lt;strong style="color: var(--text-main);"&gt;Seasonal Maintenance Upgrade&lt;/strong&gt; Expands the base license to include four distinct, seasonally engineered content packages per year (Spring, Summer, Autumn, Winter) to maintain environmental alignment with shifting property operations without requiring hardware re-configuration.&lt;br&gt;&lt;br&gt;
